# Fully-local override: no Google key, no cloud calls in the clip pipeline.
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
#
# The moment picker talks to Ollama running on the host (local/start-ollama.sh),
# which uses the GPU directly. The backend container itself runs the CPU image:
# Docker on this machine has no NVIDIA runtime. See local/README.md to switch
# the container to the GPU image once nvidia-container-toolkit is installed.
services:
  backend:
    # Run as your own user: the repo is bind-mounted at /app, and the image's
    # appuser (uid 999) cannot write to a folder you own. Override with
    # LOCAL_UID/LOCAL_GID if your ids are not 1000.
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
    environment:
      # Caches land in the repo's git-ignored .cache/ instead of image paths
      # that only appuser can write.
      HOME: /app
      HF_HOME: /app/.cache/huggingface
      YOLO_CONFIG_DIR: /app/.cache/Ultralytics
      TORCHINDUCTOR_CACHE_DIR: /app/.cache/torchinductor
      # Your uid has no /etc/passwd entry in the image; getpass.getuser()
      # (torch reads it at import) falls back to these instead of crashing.
      USER: clipper
      LOGNAME: clipper
      LLM_PROVIDER: openai
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      # Picked by local/bench_hooks.py on a real job (Nov 2026): the best
      # hooks of the models that fit fully in 16 GB VRAM. gpt-oss:20b also
      # fits but wrote headline-style hooks and clipped a sponsor read.
      LLM_MODEL: ${LLM_MODEL:-gemma4:12b}
      # Thinking off for scoring (many calls; with it Gemma took 25-48 s per
      # call and sometimes answered empty), left on for the hook/title pass.
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-none}
      LLM_DETAIL_REASONING_EFFORT: ${LLM_DETAIL_REASONING_EFFORT:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-900}
      # Scoring stays strict; hooks/titles/captions are written warmer.
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_DETAIL_TEMPERATURE: ${LLM_DETAIL_TEMPERATURE:-0.7}
      # Keep finished jobs a week (self-host default is 24 h) so you can come
      # back to them; `campaign.py prepare` copies what you post anyway.
      JOB_RETENTION_SECONDS: ${JOB_RETENTION_SECONDS:-604800}
      # CPU transcription: "small" is a good speed/accuracy balance on 16 cores.
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE: int8
      # Fewer parallel renders and one job at a time: this box has 16 GB RAM
      # shared with Ollama.
      CLIP_WORKERS: ${CLIP_WORKERS:-2}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-1}
