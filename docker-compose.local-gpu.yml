# GPU add-on for docker-compose.local.yml (needs nvidia-container-toolkit).
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml \
#                  -f docker-compose.local-gpu.yml up --build
#
# local/up.sh adds this file automatically when Docker has the nvidia runtime.
#
# VRAM budget on a 16 GB card: Ollama holds the 14B model (~11 GB with a 16k
# context) for OLLAMA_KEEP_ALIVE after the picker runs; Whisper "small" in
# float16 needs ~1 GB and runs before the picker, so one job at a time fits.
services:
  backend:
    image: clipping-backend-gpu
    build:
      context: .
      args:
        GPU: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, video, utility]
    environment:
      WHISPER_DEVICE: cuda
      WHISPER_COMPUTE: float16
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      # h264_nvenc when it works, x264 otherwise (probed once at startup).
      FFMPEG_ENCODER: ${FFMPEG_ENCODER:-auto}
